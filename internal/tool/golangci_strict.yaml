version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goprintffuncname
    - gosec
    - ineffassign
    - makezero
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - unused
    - usestdlibvars
    - usetesting
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    # perfsprint is held to the one claim the Uber guide makes: strconv over fmt
    # for conversions. Rewriting concatenations or error construction is a
    # matter of taste, and taste is not evidence.
    perfsprint:
      errorf: false
      strconcat: false
    # Only revive's defect-oriented rules are enabled. The stylistic ones would
    # force rewrites of correct code to please a linter, which is exactly the
    # behavior this harness exists to prevent.
    revive:
      rules:
        - name: atomic
        - name: constant-logical-expr
        - name: defer
        - name: duplicated-imports
        - name: identical-branches
        - name: modifies-value-receiver
        - name: string-of-int
        - name: time-equal
        - name: unconditional-recursion
        - name: waitgroup-by-value
        - name: datarace
        - name: deep-exit
    staticcheck:
      # Everything except two: ST1003 is the naming check whose own
      # documentation calls it opinionated, and ST1000 blocks once per package
      # without a package comment rather than once per defect, which is out of
      # proportion for a required gate. SA9003 (empty branch) and the doc
      # comment checks stay on; they catch stub code and drifting docs.
      checks: ["all", "-ST1000", "-ST1003"]
    gosec:
      excludes:
        # G104 duplicates errcheck, which is enabled above and more precise.
        - G104
        # G304 and G204 fire on reading a file or running a program named by a
        # variable. That is what a verification harness does on every run, so
        # here the rule has no signal left; it stays off at the policy level
        # rather than being suppressed inline at each call site.
        - G304
        - G204
  exclusions:
    # The linter reports generated files like any other; goharness decides which
    # of them are exempt. A `Code generated` header is a claim anyone can write,
    # so exempting a file the change itself introduced would hand every agent a
    # file-wide suppression. Generated code the change does not touch is dropped
    # from scope by the harness before the evidence is built.
    generated: disable
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
